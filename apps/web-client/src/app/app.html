<main>
  <h1>Relay</h1>
  @if (busy()) {
    <p role="status">Loading…</p>
  } @else if (profile()) {
    <pre>{{ profile() | json }}</pre>
    <button type="button" (click)="logout()">Sign out</button>
  } @else {
    <button type="button" (click)="sessions.login()">Continue with GitHub</button>
  }
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
</main>
