name: CI - Mobile client

on:
  push:
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile-client/**'
      - '.github/workflows/ci-mobile.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install mobile client dependencies
        run: flutter pub get

      - name: Lint mobile client
        run: flutter analyze

      - name: Test mobile client
        run: flutter test

      - name: Build mobile client (Android APK)
        run: flutter build apk
