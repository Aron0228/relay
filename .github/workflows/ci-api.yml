name: CI - API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'codecov.yml'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'codecov.yml'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FFMPEG_VERSION: '7.0.2'
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/relay_test
      REDIS_TEST_HOST: 127.0.0.1
      REDIS_TEST_PORT: 6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install API dependencies
        run: pnpm --filter ./apps/api install --frozen-lockfile

      - name: Lint API
        run: pnpm --dir apps/api run lint

      # Static binaries avoid APT's codec dependencies and slow package mirrors.
      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_VERSION }}-v1

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          ffmpeg-version: ${{ env.FFMPEG_VERSION }}

      - name: Verify FFmpeg H.264 encoding
        run: >-
          ffmpeg -hide_banner -loglevel error
          -f lavfi -i color=c=black:s=16x16:d=0.1
          -frames:v 1 -c:v libx264 -pix_fmt yuv420p -f null -

      - name: Install Playwright Chromium
        run: pnpm --dir apps/api exec playwright install --with-deps chromium

      - name: Run test database migrations
        working-directory: apps/api
        shell: bash
        run: |
          # db-migrate uses JavaScript entry points, including for SQL migrations.
          if compgen -G 'migrations/*.js' > /dev/null; then
            pnpm exec db-migrate up --env test
          else
            echo "No migrations found; skipping database migrations."
          fi

      - name: Test API with coverage
        run: pnpm --dir apps/api run coverage

      - name: Build API
        run: pnpm run build:api

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api
          use_pypi: true
          fail_ci_if_error: true
