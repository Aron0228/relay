name: CI - API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'codecov.yml'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'codecov.yml'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/relay_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install API dependencies
        run: pnpm --filter ./apps/api install --frozen-lockfile

      - name: Lint API
        run: pnpm --dir apps/api run lint

      - name: Run test database migrations
        working-directory: apps/api
        shell: bash
        run: |
          # db-migrate uses JavaScript entry points, including for SQL migrations.
          if compgen -G 'migrations/*.js' > /dev/null; then
            pnpm exec db-migrate up --env test
          else
            echo "No migrations found; skipping database migrations."
          fi

      - name: Test API with coverage
        run: pnpm --dir apps/api run coverage

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: true

      - name: Build API
        run: pnpm run build:api
