name: CI - API

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install API dependencies
        run: pnpm --filter ./apps/api install --frozen-lockfile

      - name: Lint API
        run: pnpm --dir apps/api run lint

      - name: Test API
        run: pnpm --dir apps/api run test

      - name: Build API
        run: pnpm run build:api
